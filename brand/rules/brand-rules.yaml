# Regras de marca da More, testáveis. Tokens guardam valores atômicos; este arquivo guarda as relações.
# Fonte: site mymore.design (2026-10-15) + call JJ x More (2026-10-15). Status: provisório até a equipe da More aprovar.
# Zero regra ambígua: cada regra tem um limite, uma lista ou um par de exemplos.
#   check: script    -> node checks/<script>.mjs <arquivos>; sai com 1 e mensagem em pt-BR quando falha
#   check: examples  -> brand/examples/<ID>-sim.jpg e <ID>-nao.jpg, legenda em brand/examples/README.md
# Tudo de uma vez: node checks/run-all.mjs <pasta>. Autoteste: node checks/self-test.mjs. Mapa completo: checks/README.md
version: 0.4
rules:
  - id: R-COLOR-01
    scope: core
    rule: 'toda cor literal em CSS/HTML/SVG é o valor de um token de cor aprovado (brand/generated/tokens.css). Tokens color.site-sem-token-* (#1A1A1A, #DAD7D1, #DEDBD5) não contam como aprovados. Branco opaco só em color/fill/stroke (texto sobre fundo escuro), nunca em background. Definição de variável (--x: valor, como um tokens.css copiado) não é uso e não conta'
    check: script   # node checks/color-tokens.mjs <css|html|svg...>  (inclui cstack tokens lint --allow #fff)
  - id: R-COLOR-02
    scope: core
    rule: 'html/body/:root declara background off-white #E5E1DB e color preto #2D211E; #000 opaco não aparece em nenhuma propriedade; #FFF nunca é fundo de html/body. Hoje o site quebra isto (body sem color, o texto corrido sai #000). Caso impresso (layout com @page ou @media print) - off-white é o papel, então html/body na impressão têm background none/transparent (em @media print); off-white como fundo impresso falha. Texto branco sobre campo é papel sem tinta (vazado)'
    check: script   # node checks/ground-ink.mjs <todos os css/html da página>
  - id: R-COLOR-03
    scope: core
    rule: 'ciano-destaque #8BC0D0 é a única cor cromática da interface (saturação HSL >= 0,25; a outra exceção é erro #E07A5F em seletor de erro). Ciano só aparece como estado ativo ou hover de navegação - seletor de navegação (nav, menu, filter, collection, categor, tab, link <a>) com :hover, .active, .is-active, :focus, [aria-current], .current, .selected. É o que o site faz - a aba Fixos (a#collection-fixos.active e :hover). Nunca como texto sobre off-white (contraste 1,53:1) e nunca decorativo. Em layout de peça impressa ou social (HTML/CSS com @page, data-canvas, ou nome com PRINT, IG, IGS, CONVITE, LIVRO, VITRINE, ETIQUETA, CARTAZ) os tons campo são permitidos (R-COLOR-04) e o ciano só aparece como o adesivo quadrado de 10 mm de "pronta entrega" (width e height 10mm/37,8px)'
    proposed:
      - text: 'ciano significa "disponível agora / pronta entrega"'
        status: proposed   # inferida: no site o ciano marca só a aba Fixos; "Pronta entrega" no card está em cinza-medio
      - text: 'em peça impressa/social, ciano só como adesivo quadrado de 10 mm de "pronta entrega"'
        status: proposed
    check: script   # node checks/accent.mjs <css|html...>
  - id: R-SHAPE-01
    scope: core
    rule: 'estrutura é reta (radius.none) - imagens, cards, barras, botões de checkout e filtro, inputs. border-radius só pode ser 0, 2px (radius.thumb), 8px (radius.tooltip), 10px (radius.panel), 50% (radius.round, círculos) ou as formas de tooltip "8px 8px 0" / "0 8px 8px". Qualquer outro valor falha. O site tem três fora da escala (5px no modal, 6px no vídeo do sobre, 20px no label do modal)'
    check: script   # node checks/radius.mjs <css|html...>
  - id: R-TYPE-01
    scope: core
    rule: 'font-family começa com Muoto ou MuotoMono (Muoto Mono Condensed); fallbacks só DM Sans, Martian Mono, Helvetica Neue, Arial, sans-serif, ui-monospace, Menlo, monospace. Pesos - Muoto 400, ou 300 em seletor .muoto (o site pede 300, mas só o arquivo Regular é carregado, então renderiza 400); MuotoMono 400; 600 só em seletor de filtro ativo (active, ativo, selected, current, checked); 700 e qualquer outro peso falham'
    check: script   # node checks/type.mjs <css|html...>   (na página publicada também: cstack type qa <url> --families "Muoto,MuotoMono" --max-families 2)
  - id: R-TYPE-02
    scope: core
    rule: 'toda ação de texto (<button>, <input type=submit|button>, <a> com classe btn/button, role=button) tem uma palavra entre colchetes ([Voltar], Menu [+]). Ação só com ícone falha. Controles isentos - miniatura (conteúdo <img>), quantidade (+/-; class quantity, qty, stepper), fechar só com ícone (class ou aria-label close/fechar) e amostra de material (swatch, material, color-option). Botão em pílula é pego por R-SHAPE-01. No site falham hoje as ações de texto Checkout, Adicionar / A partir de, Baixar, Cadastrar, Todos e Categorias. Colchete envolve só ação ([Comprar], [Como chegar], Menu [+]); status e lugar nunca levam colchete ("Pronta entrega", "Sob encomenda · ~120 dias", "Jardins"). Peça estática (PNG de story/feed, cartaz, etiqueta - layout com @page, data-canvas ou nome PRINT/IG/IGS/CONVITE/LIVRO/VITRINE/ETIQUETA/CARTAZ) não tem ação, então não tem colchete; o link vai na legenda ou no sticker de link do story'
    check: script   # node checks/actions.mjs <html...>
  - id: R-LAYOUT-01
    scope: core
    rule: 'menu, carrinho e adicionar-ao-carrinho (seletor fixed/sticky com menu, add-to-cart, add_to_cart, in-cart, cart-button, checkout) ficam em barras flutuantes embaixo - declaram bottom e nunca top, centralizadas (left 50% + translate(-50%), ou left 0 + right 0), height 35px quando declaram altura, fundo com alfa < 1 (vidro preto-10/preto-80/cinza-overlay). Sem cabeçalho fixo - seletor fixed/sticky com header, cabecalho, topbar, navbar, nav ou toolbar e top falha. Isentos, padrão do site - o filtro da coleção (.collection-list__filter, sticky no topo) e o botão flutuante de voltar (.floating-back-button, topo, 30px)'
    check: script   # node checks/bars.mjs <css|html...>
  - id: R-LAYOUT-02
    scope: core
    rule: 'uma peça por foto de produto (grade, PDP, post de peça), ver o par de exemplos. Proporção da imagem 3:4 (fonte), 4:5 (feed, 1080x1350), 9:16 (story, 1080x1920, 250px de área segura em cima e embaixo) ou 3:2 (só lista horizontal), tolerância 1%. Em CSS de imagem, aspect-ratio só 3/4, 4/5, 9/16, 3/2; foto de produto com border-radius 0; miniatura e amostra de material (thumb, swatch, material, sample) podem ter 2px (radius.thumb), como no site. Raio fora da escala fica com R-SHAPE-01, sem contar duas vezes. O script só mede foto de produto e exportação de foto para canal - arquivo numa pasta fotos/ ou com foto, photo, PDT_, ig-feed/ig-story, story, feed, _IG_ ou _IGS_ no nome. Nunca mede captura de página nem render de layout (nome com web, captura ou folha, ou imagem mais alta que 2,5x a largura)'
    check: script   # node checks/aspect.mjs <imagem|css...>  + examples  # brand/examples/R-LAYOUT-02-sim/nao (uma peça)
  - id: R-IMG-01
    scope: core
    rule: 'foto de peça é fotografia, nunca gerada ou alterada por IA; troca de acabamento só com foto real ou render exato do material. O arquivo falha se tiver metadado IPTC DigitalSourceType trainedAlgorithmicMedia/compositeWithTrainedAlgorithmicMedia/algorithmicMedia, metadado que cite um gerador (Midjourney, DALL-E, gpt-image, Firefly, Stable Diffusion, Imagen, Gemini, Flux, Ideogram, Runway, Sora, Recraft, Krea, Magnific, Generative Fill) ou sidecar <arquivo>.lineage.json com operação de geração/edição. Quem exporta preserva os metadados'
    check: script   # node checks/no-ai.mjs <imagem...>
  - id: R-IMG-02
    scope: core
    rule: 'registro estúdio = fundo bege infinito + uma luz dura lateral com sombra de janela de borda nítida; registro low-key = fundo quase preto + uma luz quente rasante. Luz difusa, sombra de borda mole e preto levantado para cinza falham. Ver o par de exemplos. As fotos próprias da More já publicadas (feed do Instagram e site) são o conjunto de referência e sempre passam; o par de exemplos vale para sessões novas'
    check: examples   # brand/examples/R-IMG-02-sim.jpg / R-IMG-02-nao.jpg
  - id: R-GEN-01
    scope: core
    rule: 'a marca entra sempre com os paths oficiais (assets/official/more-wordmark.svg, more-wordmark-currentcolor.svg ou more-wordmark-small.svg, coordenadas a 0,1), inline no SVG/HTML, com fill="currentColor" nos paths e a cor dada pelo CSS a partir dos tokens. Nunca por <img>/<image>/<use> - <img> não herda currentColor e o more-wordmark.svg sai #000, o que quebra R-COLOR-02 (o fill black do arquivo é padrão do arquivo, não cor da marca). "MORE" digitado como texto ou paths diferentes falham. Em imagem gerada, a marca é composta depois (skill image-edit), nunca pedida ao modelo; as faces 205TF também não entram em prompt'
    check: script   # node checks/wordmark.mjs <svg|html...>
  - id: R-COPY-01
    scope: core
    rule: 'nenhuma palavra proibida (exclusivo/a, exclusividade, sofisticado/a, sofisticação, luxuoso/a, luxo, requintado/a, requinte, premium, glamour, chique, alma, essência, personalidade); zero ponto de exclamação, emoji e hashtag; nenhuma frase com mais de 16 palavras (máximo do feed de 2026). Conteúdo de tabela, lista de definição e itens de lista (table, dl, li - fichas e medidas) não conta para o tamanho de frase. "personalidade" segue proibida, exceto dentro de uma linha aprovada escrita igual, listada em checks/aprovadas.json'
    check: script   # node checks/copy.mjs <txt|md|html...>
  - id: R-COMMERCE-01
    scope: page
    rule: 'toda página de produto (og:type=product) mostra em texto exatamente um rótulo - "Pronta entrega", sem prazo, ou "Sob encomenda" com prazo em dias, semanas ou meses ("Sob encomenda · ~120 dias"; ~120 dias é o padrão do negócio, salvo quando a ficha da peça diz outro prazo). Só o texto é checado, não a cor (no card de grade do site, "Pronta entrega" é .product-card-grid__ready-delivery em cinza-medio 10px, visível no hover)'
    check: script   # node checks/commerce.mjs <produto.html...>
  - id: R-COMMERCE-02
    scope: page
    rule: 'nenhum card de grade (classe product-card* ou card-product*) mostra preço (R$); o preço fica na página de produto (proposta da call de 2026-10-15, ainda não decidida pela equipe)'
    check: script   # node checks/grid-price.mjs <html...>
  - id: R-MOTION-01
    scope: core
    rule: 'duração é um token motion.duration - 80, 140, 200, 300, 450, 500, 700, 800 ou 1000ms (0s = troca instantânea); qualquer outro valor falha (no site - 150, 180, 280, 400, 600ms). Curva - ease (a principal do site), ease-out, ease-in-out ou os tokens snap, out-expo, out-quint; linear só em contador (ou com duração 0); ease-in e qualquer outro cubic-bezier falham. "transition: all" falha. Todo seletor animado tem fallback em @media (prefers-reduced-motion - reduce), por regra * ou pelo mesmo seletor'
    check: script   # node checks/motion.mjs <todos os css da página>
  - id: R-COPY-02
    scope: core
    status: proposed   # leitura por função 2026-10-15; fórmula de legenda do Instagram
    rule: 'duas fórmulas; o script escolhe pela primeira linha "tipo: peca|evento|bastidores|marca" ou pelo nome do arquivo (evento, abertura, bastidores, marca, sobre => fato). PEÇA - frase com o nome canônico (checks/nomes-canonicos.json), depois UMA linha seca de 3 a 12 palavras, antes da linha de material (opcional). FATO (evento, bastidores, marca, post sem peça) - a primeira linha diz o fato (o quê; em evento também quando, data dd.mm ou "dd de mês", e onde); depois no máximo UMA linha seca; o resto são linhas de fato (endereço, horário); nome de peça não é exigido. Linha seca = sem palavra de material/ficha da lista publicada em checks/palavras-de-material.json e sem status ("Pronta entrega", "Sob encomenda"). Sempre 4-145 palavras e palavras proibidas de R-COPY-01. A linha seca discorda da convenção, no tom destas aprovadas (checks/aprovadas.json) - "Não é quadrada, só parece.", "Essa não vai com as outras", "Nada grita, só a concorrência.", "Precisa da sua Maria.", "Não foi feita para combinar com o sofá."'
    check: script   # node checks/caption.mjs <legenda.txt...>  (estrutura medida; o tom é comparado com as linhas acima)
  - id: R-COPY-03
    scope: core
    status: proposed
    rule: 'português primeiro. Página com <html lang="pt-BR">; todo bloco de 6+ palavras em inglês (mais palavras-função inglesas que portuguesas) fica dentro de elemento lang="en" como segunda versão; em texto solto o primeiro parágrafo é português. O texto em inglês do Sobre quebra isto hoje'
    check: script   # node checks/lang.mjs <html|txt|md...>
  - id: R-COLOR-04
    scope: print, social, store
    status: proposed   # leitura por função 2026-10-15
    rule: 'tons color.campo (vermelho-jambo, amarelo-igarata, verde-jamaica, berinjela; petróleo é só proposta) são fundo de cartaz, convite, livro, vitrine e social. Em imagem - no máximo um tom campo com 5%+ dos pixels (a até ΔE 10 em CIELAB); petróleo nunca como fundo (20%+); em peça gráfica (MORE_PRINT/CONVITE/LIVRO/VITRINE) o fundo é chapado - dos pixels a até ΔE 25 do tom, 85%+ estão a até ΔE 10. Em CSS da loja/site, nenhum tom campo (R-COLOR-03 pega); em layout impresso/social (@page, data-canvas, nome PRINT/IG/IGS/CONVITE/LIVRO/VITRINE/ETIQUETA/CARTAZ) o campo é permitido. Ciano fica fora das peças campo (é cor de interface)'
    check: script   # node checks/campo.mjs <imagem...> [--grafica]  + node checks/accent.mjs <css>
  - id: R-LOGO-01
    scope: core
    status: proposed
    rule: 'num layout (SVG com viewBox, ou HTML com data-canvas="LxA"), medido pelo script. Onde leva marca (tipo lido do nome MORE_<CANAL>_<slug>_<variante>; MORE_FONTE_ pela variante) - obrigatória em post de evento (IG com slug evento-<aaaammdd>) e em cartaz, convite, vitrine e livro; proibida em post de peça no feed (que também não leva texto sobre a foto, observado em 76% do feed; o texto vai na legenda) e em story (IGS); opcional em etiqueta (ETIQUETA). M - lado maior da marca = alvo 1/6 (16,7%) do lado menor do quadro, tolerância 16-25%. XL - largura da marca 95-100% da largura do quadro, base 0-5% acima do pé do quadro, sem sangrar (marca inteira dentro); XL pode passar por cima da margem do grid de impressão (1/24 do lado menor). Outro tamanho falha. Cor só preto #2D211E, branco #FFF ou off-white #E5E1DB; sobre amarelo-igarata, preto; sobre vermelho-jambo, verde-jamaica e berinjela, branco. Nunca contornada, espelhada, esticada ou com padrão. Proposto e fora do guia até aceitarem - S mínimo 60px/18mm e respiro = altura do O'
    check: script   # node checks/logo.mjs <layout.svg|layout.html...>
  - id: R-SHAPE-02
    scope: core
    status: rejected   # inventada por nós; o convite 05.11 da própria marca usa elipse. Fica fora do guia.
    rule: 'no ellipses, pills or rounded graphic shapes in any medium'
    check: judge
  - id: R-LAYOUT-03
    scope: page
    status: proposed
    rule: 'todo contêiner com rolagem vertical (overflow ou overflow-y auto/scroll) termina com padding-bottom >= 106px (layout.bar-safe) no mesmo seletor, para as barras flutuantes nunca cobrirem conteúdo no celular'
    check: script   # node checks/scroll-safe.mjs <css|html...>
  - id: R-NAME-01
    scope: core
    status: proposed   # naming.inconsistencies
    rule: 'um nome canônico por peça, "<Tipo> <complemento em minúscula> <Nome>" (Mesa de centro Cildo, Cadeira 556-A), igual no site, Instagram, etiquetas e arquivos. A lista e as variantes proibidas estão em checks/nomes-canonicos.json; as marcadas decisao_pendente (Ngoni, Leticia/Letícia, Naz componível, INT.01) esperam a equipe'
    check: script   # node checks/names.mjs <txt|md|html|csv...>
  - id: R-FILE-01
    scope: core
    status: proposed
    rule: 'arquivos se chamam MORE_<CANAL>_<peça-slug>_<variante>_<AAAAMMDD>_v<nn>.<ext> (MORE_IG_mesa-de-centro-cildo_4x5_20261105_v02.jpg). CANAL - IG, IGS, SITE, PRINT, ETIQUETA, LIVRO, CONVITE, VITRINE, EMAIL, VIDEO, FONTE (HTML-fonte de uma peça); peça-slug = slug de nome canônico; sem peça, "marca" ou "evento-<aaaammdd>"; variante [a-z0-9-]; data real; extensão minúscula. Prefixo numérico de ordem ("01_") só dentro de pasta cujo nome começa com teste'
    check: script   # node checks/filename.mjs <arquivo...>
  - id: R-PRINT-01
    scope: print
    status: proposed
    rule: 'vale para cartaz, convite, livro, vitrine e etiqueta. O PDF entregue tem a página no formato final + 3 mm de sangria por lado (MediaBox = BleedBox) e TrimBox no formato final (ex. etiqueta 50x90 mm => página 56x96 mm; A2 420x594 => 426x600 mm). Off-white nunca é tinta (é o papel; papel natural sem revestimento 90-150 g/m²); no HTML-fonte, html/body com background none/transparent em @media print (ver R-COLOR-02); texto branco sobre campo = papel sem tinta (vazado). Raster de impressão >= 300 dpi. PDF com PDF/X-4 declarado = FINAL. PDF sem X-4 mas com as caixas certas = PROVA (não vai para gráfica) e passa - as ferramentas do repositório não geram X-4; a exportação final em PDF/X-4 com perfil CMYK é passo da gráfica/estúdio. Conferido no preflight, sem script - margem de segurança 5 mm; preto rico C60 M40 Y40 K100 (o único valor) só em áreas >= 10 mm de altura, texto < 10 pt em K100 puro'
    check: script   # node checks/print.mjs <pdf|imagem MORE_PRINT_...>
  - id: R-MOTION-02
    scope: core
    status: proposed   # proposta nossa
    rule: 'vídeo troca de foto por corte seco (Hard cut) - nenhuma fusão nem fade, medido pelo script; o movimento de luz é Shadow sweep (mancha dura de janela atravessa a peça com a câmera parada, observado no convite 05.11), ver o par de exemplos. Proposto e fora do guia até aceitarem - Build (letras M-O-R-E em sequência, 120ms de intervalo)'
    check: script   # node checks/cuts.mjs <video...>  + examples  # brand/examples/R-MOTION-02-sim/nao (Shadow sweep)
  - id: R-MOTION-03
    scope: core
    status: proposed   # proposta nossa, medida no site e nas referências em 2026-10-15
    rule: 'a segunda foto do card entra por fusão no mesmo quadro 3:4 - só opacity muda (0 => 1), duração motion.role.hover-swap 300ms (ou 0 = troca seca), curva ease ou ease-out; a primeira foto nunca escurece parcialmente (opacity entre 0 e 1 falha), nenhuma escala nem deslocamento (transform só none ou translate(-50%,-50%)), a segunda foto ocupa o quadro (width 100%, object-fit cover); nome e preço não mudam. Hoje o site faz escala .8 => 1 a 75% do quadro em 200ms snap e escurece a primeira a 60%: falha. The Row e Jacquemus fazem 300ms ease só em opacity; Knoll 600ms com escala .95 (fora da regra)'
    check: script   # node checks/hover-swap.mjs <css da página>
  - id: R-MOTION-04
    scope: core
    status: proposed   # proposta nossa; os princípios vêm da seção 8 do dossiê do catálogo (15.10.2026)
    rule: 'a interação orienta, não encena - nenhum sequestro de rolagem (scroll-snap-type mandatory em html/body, roda do mouse com preventDefault), nenhum loader teatral (animation infinite fora de contador/progresso), nenhum cursor personalizado (cursor url() ou none), nenhum carrossel automático (autoplay); o que o hover revela abre também por foco (:focus-within ou :focus-visible no mesmo seletor), porque no toque não existe hover; toda página tem fallback em prefers-reduced-motion (R-MOTION-01)'
    check: script   # node checks/interacao.mjs <css/html da página>

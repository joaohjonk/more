# Machine-testable brand rules for More. Tokens hold atomic values; this file holds relationships.
# Source: live site mymore.design (2026-10-15) + JJ x More call (2026-10-15). Status: provisional until the More team approves.
version: 0.3
rules:
  - id: R-COLOR-01
    scope: core
    rule: pages use only color tokens; no raw hex outside brand/generated/tokens.css (white only as text on dark)
    check: deterministic   # cstack tokens lint <files> --allow #fff
  - id: R-COLOR-02
    scope: core
    rule: the page ground is off-white (#E5E1DB), never pure white; ink is preto (#2D211E), never pure black. The live site breaks this today: body has no color, so running text renders #000
    check: deterministic
  - id: R-COLOR-03
    scope: core
    rule: ciano-destaque is the only chromatic UI colour and means "available now / buyable"; never decorative
    check: judge
  - id: R-SHAPE-01
    scope: core
    rule: structure is square (radius.none) - images, cards, bars, checkout and filter buttons, inputs. Radius only on small or floating parts, from the scale radius.thumb 2px, radius.tooltip 8px, radius.panel 10px, radius.round 50% (circles). Any other value fails. The live site has three off-scale radii (5px modal file, 6px about video, 20px modal label)
    check: deterministic   # node checks/radius.mjs <css>
  - id: R-TYPE-01
    scope: core
    rule: two families only, Muoto (names, prices, statements) and Muoto Mono Condensed (interface); one weight, 600 only for an active filter
    check: deterministic   # cstack type qa <url> --families "Muoto,MuotoMono" --max-families 2
  - id: R-TYPE-02
    scope: core
    rule: interface actions are mono words in square brackets ([Voltar], Menu [+]); no pill buttons, no icons-only actions
    check: judge
  - id: R-LAYOUT-01
    scope: core
    rule: navigation and the primary action live in floating 35px glass bars, centred at the bottom; no fixed top header
    check: judge
  - id: R-LAYOUT-02
    scope: core
    rule: one piece per image, sourced 3:4 portrait (3:2 only for landscape list views); channel crops come from the 3:4 source (Instagram feed 4:5 1080x1350, story 9:16 1080x1920 with 250px safe zones); never circles or rounded
    check: deterministic   # cstack audit <file> --aspect 3:4|4:5|9:16
  - id: R-IMG-01
    scope: core
    rule: product pieces are photographed, never generated or altered by AI; finish swaps must come from real photos or exact material renders
    check: judge
  - id: R-IMG-02
    scope: core
    rule: studio register = warm beige seamless + one hard side light with a crisp window shadow; low-key register = near-black + one warm raking light
    check: judge
  - id: R-GEN-01
    scope: core
    rule: never approximate the wordmark or the 205TF faces in a generated image; composite assets/official/more-wordmark.svg
    check: judge
  - id: R-COPY-01
    scope: core
    rule: copy is short, declarative and about material and making; no luxury adjectives (exclusivo, sofisticado, luxuoso), no exclamation marks
    check: judge
  - id: R-COMMERCE-01
    scope: page
    rule: buyable-now items (tomada) carry a visible "Pronta entrega" / Comprar signal in ciano-destaque; made-to-order items say "Sob encomenda" and the lead time
    check: judge
  - id: R-COMMERCE-02
    scope: page
    rule: price lives on the product page, not on the gallery grid (proposal from the 2026-10-15 call, not yet decided by the team)
    check: judge
  - id: R-MOTION-01
    scope: core
    rule: motion is fades and grows of 200-800ms with ease-out; everything has a prefers-reduced-motion fallback
    check: deterministic
  - id: R-COPY-02
    scope: core
    status: proposed   # leitura por função 2026-10-15; Instagram caption formula
    rule: each piece gets one dry line that disagrees with convention, before the material line ("Não é quadrada, só parece."); never alma, essência, personalidade, sofisticado
    check: judge
  - id: R-COPY-03
    scope: core
    status: proposed
    rule: Portuguese first; English only as a second version, never the default (the English About text breaks this)
    check: judge
  - id: R-COLOR-04
    scope: print, social, store
    status: proposed   # leitura por função 2026-10-15
    rule: color.campo tones (vermelho-jambo, amarelo-igarata, verde-jamaica, berinjela; petroleo is proposed only) are flat backgrounds for posters, invites, book, window and social, one per piece; never in shop UI chrome, never two in one frame; ciano keeps its meaning (available now)
    check: judge
  - id: R-LOGO-01
    scope: core
    status: proposed
    rule: the wordmark appears at M (1/6 of the short side, observed range 16-25%) or XL (95-100% of the width, bottom-aligned, observed on the 05.11 invite); preto, branco or off-white only; never outlined, mirrored or patterned. Proposed and not in the guide until accepted - S 60px/18mm minimum and clear space = height of the O
    check: judge
  - id: R-SHAPE-02
    scope: core
    status: rejected   # inventada por nós; o convite 05.11 da própria marca usa elipse. Fica fora do guia.
    rule: no ellipses, pills or rounded graphic shapes in any medium
    check: judge
  - id: R-LAYOUT-03
    scope: page
    status: proposed
    rule: every scroll container ends with layout.bar-safe (106px) so the floating bars never cover content on mobile
    check: deterministic
  - id: R-NAME-01
    scope: core
    status: proposed   # naming.inconsistencies
    rule: one canonical name per piece, "<tipo em minúscula> <Nome>" (Mesa de centro Cildo, Cadeira 556-A), identical on site, Instagram, tags and files
    check: deterministic
  - id: R-FILE-01
    scope: core
    status: proposed
    rule: files are named MORE_<canal>_<peça-slug>_<variante>_<AAAAMMDD>_v<nn>.<ext> (MORE_IG_mesa-de-centro-cildo_4x5_20261105_v02.jpg)
    check: deterministic
  - id: R-PRINT-01
    scope: print
    status: proposed
    rule: off-white is the paper, never a printed flood (uncoated natural stock 90-150g); preto prints as rich black only on large areas; 300dpi, PDF/X-4, 3mm bleed, 5mm safety
    check: judge
  - id: R-MOTION-02
    scope: core
    status: proposed   # proposta nossa
    rule: video uses Shadow sweep (hard window shadow travels across the piece, observed on the 05.11 invite) and Hard cut (photo swap without fade, inferred from carousel order). Proposed and not in the guide until accepted - Build (M-O-R-E letters in sequence, 120ms stagger)
    check: judge

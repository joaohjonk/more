<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Peças na loja · More</title>
<style>
@font-face{font-family:Muoto;font-weight:400;font-style:normal;src:url(/fonts/mr.otf) format('opentype')}
@font-face{font-family:MuotoMono;font-weight:400;font-style:normal;src:url(/fonts/mm.woff2) format('woff2')}
:root{--off-white:#E5E1DB;--preto:#2D211E;--cinza-escuro:#5D554F;--cinza-medio:#686868;--ciano:#8BC0D0;
--sans:Muoto,"DM Sans",Arial,sans-serif;--mono:MuotoMono,"Martian Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-synthesis:none;background:#9a948c;font-family:var(--sans);color:var(--preto);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
body{padding:40px}
/* A4 210 x 297 mm at 4 px/mm = 840 x 1188; off-white is the paper */
.page{position:relative;width:840px;height:1188px;background:var(--off-white);padding:48px 48px 0;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:flex-start}
.wm{width:140px;height:auto}  /* M: 1/6 of the short side (35 mm) */
.wm path{fill:var(--preto)}
.head .r{text-align:right;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--cinza-escuro)}
h1{font-weight:400;font-size:44px;line-height:.95;letter-spacing:-.015em;margin-top:32px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);column-gap:14px;row-gap:14px;margin-top:26px}
figure{margin:0}
.ph{aspect-ratio:4/5;overflow:hidden;background:#DCD7CF}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{margin-top:7px;font-size:11px;line-height:1.3}
figcaption span{display:block;font-family:var(--mono);font-size:10px;color:var(--cinza-escuro);margin-top:2px;min-height:14px}
figure .grp{display:block;font-family:var(--mono);font-size:10px;color:var(--cinza-escuro);margin-bottom:6px;min-height:14px}
figcaption .pe{color:var(--preto)}
figcaption .pe::before{content:"";display:inline-block;width:7px;height:7px;border:1px solid var(--preto);margin-right:5px;vertical-align:middle}
.bar{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--preto);color:var(--off-white);font-family:var(--mono);font-size:12px;display:flex;align-items:center;justify-content:space-between;padding:0 48px}
.note{position:absolute;left:48px;right:48px;bottom:62px;font-family:var(--mono);font-size:11.5px;color:var(--cinza-medio);display:flex;justify-content:space-between}
@page{size:210mm 297mm;margin:0}
@media print{html,body{background:none;padding:0}.page{width:210mm;height:297mm;background:none}}
</style></head>
<body>
<div class="page" id="page">
  <div class="head">
    <svg class="wm" viewBox="0 0 272 69" aria-label="MORE"><path d="M176.593 23.0819V1.91833H150.317V66.5948H176.593V44.2791H205.243V1.91833C189.55 1.91833 177.465 13.093 176.593 23.0875V23.0819Z"/><path d="M111.007 0C91.875 0 76.3403 15.3302 76.3403 34.223C76.3403 53.1159 91.8693 68.4461 111.007 68.4461C130.145 68.4461 145.742 53.1159 145.742 34.223C145.742 15.3302 130.213 0 111.007 0ZM111.007 42.4334C106.43 42.4334 102.69 38.8036 102.69 34.2174C102.69 29.6313 106.435 26.0015 111.007 26.0015C115.579 26.0015 119.398 29.6984 119.398 34.2174C119.398 38.7365 115.653 42.4334 111.007 42.4334Z"/><path d="M35.919 19.6423L26.2764 1.91833H0V66.5948H26.2764V44.212H45.4936V66.5948H71.77V1.91833H45.4936L35.919 19.6423Z"/><path d="M272.002 1.87909H211.835V24.7541V34.7487V44.1783V66.5612H272.002V44.7376H238.219L255.669 34.7151L238.236 24.7541H272.002V1.87909Z"/></svg>
    <div class="r">Peças na loja<br>Novembro de 2026</div>
  </div>
  <h1>Vinte e quatro peças.<br>Uma luz só.</h1>
  <div class="grid" id="grid"></div>
  <div class="note"><span>Sob encomenda: madeira, acabamento e tecido à escolha. Prazo de 120 dias.</span><span>■ pronta entrega</span></div>
  <div class="bar"><span>Al. Franca 1332, Casa 04 · Jardins, São Paulo</span><span>mymore.design · @more.mymore · Fale com a More: (11) 91209-2600</span></div>
</div>
<script>
fetch('produtos.json').then(r=>r.json()).then(rows=>{
  const order=['Assentos','Mesas','Luminárias','Estantes','Fixos'];
  const fix={'Mesa de Apoio Carnívora':'Mesa de apoio Carnívora','Mesa de Centro Imi':'Mesa de centro Imi','Cadeira 556':'Cadeira 556-A','Mesa Cildo':'Mesa de centro Cildo'};rows.forEach(r=>{r.title=fix[r.title]||r.title});
  rows.sort((a,b)=>order.indexOf(a.cat)-order.indexOf(b.cat)||a.title.localeCompare(b.title));
  const g=document.getElementById('grid');
  let last='';rows.forEach(r=>{
    const pe=r.handle==='tomada-tom-01'||r.handle==='luminaria-ngoni';
    const f=document.createElement('figure');
    const grp=r.cat!==last?r.cat:'';last=r.cat;
    f.innerHTML='<span class="grp">'+grp+'</span><div class="ph"><img src="'+r.img+'" alt=""></div><figcaption>'+r.title+'<span class="'+(pe?'pe':'')+'">'+(pe?'pronta entrega':'')+'</span></figcaption>';
    g.appendChild(f);
  });
});
</script>
</body></html>

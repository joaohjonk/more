<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Etiquetas de peça · More</title>
<style>
@font-face{font-family:Muoto;src:url(../_fonts/205TF-Muoto-Regular.otf) format('opentype')}
@font-face{font-family:MuotoMono;src:url(../_fonts/205TF-MuotoMono-CondensedRegular.woff2) format('woff2')}
:root{--off-white:#E5E1DB;--preto:#2D211E;--cinza-escuro:#5D554F;--cinza-medio:#686868;--ciano:#8BC0D0;--faca:#5D554F;
--sans:Muoto,"DM Sans",Arial,sans-serif;--mono:MuotoMono,"Martian Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#9a948c;font-family:var(--sans);color:var(--preto);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
body{display:flex;gap:40px;padding:40px;flex-wrap:wrap;align-items:flex-start}
.mono{font-family:var(--mono)}
/* 4 px = 1 mm. O off-white é o papel: não imprime. */
.tag{position:relative;background:var(--off-white);overflow:hidden}
.wm{height:auto;display:block}.wm path{fill:var(--preto)}
.hole{position:absolute;left:50%;border:1px solid rgba(45,33,30,.35);border-radius:50%}
.cat{position:absolute;font-family:var(--mono);color:var(--cinza-escuro)}
h1{font-weight:400;line-height:1;letter-spacing:-.015em}
.desc{line-height:1.35;color:var(--cinza-escuro)}
dl div{display:grid;gap:12px;border-top:1px solid rgba(45,33,30,.25);line-height:1.4}
dt{font-family:var(--mono);color:var(--cinza-escuro);padding-top:2px}
.foot{position:absolute;display:flex;justify-content:space-between;align-items:flex-end}
.status{font-family:var(--mono);line-height:1.4}
.status .sq{display:inline-block;width:10mm;height:10mm;background:var(--ciano);vertical-align:bottom;margin-right:10px}
.price.aviso,dd .aviso{font-family:var(--mono);color:var(--cinza-escuro)}
.qr img{width:100%;height:100%;image-rendering:pixelated;display:block}
.sub{font-family:var(--mono);color:var(--cinza-medio);text-align:right}

/* ficha A6 105 x 148 */
.a6{width:420px;height:592px;padding:32px 28px}
.a6 .wm{width:72px}.a6 .hole{top:32px;width:24px;height:24px;margin-left:-12px}
.a6 .cat{right:28px;top:34px;font-size:11px}
.a6 h1{font-size:42px;margin-top:60px}.a6 .desc{font-size:15px;margin-top:12px;max-width:300px}
.a6 dl{margin-top:28px}.a6 dl div{grid-template-columns:96px 1fr;padding:9px 0;font-size:12.5px}.a6 dt{font-size:11px}
.a6 .foot{left:28px;right:28px;bottom:28px}.a6 .status{font-size:13px}.a6 .price{font-size:15px;margin-top:6px}.a6 .price.aviso{font-size:11px}
.a6 .qr{width:72px;height:72px}.a6 .sub{font-size:10px;margin-top:6px}

/* etiqueta de pendurar 50 x 90 (sistema: cartão sem revestimento 50x90): nome, uma linha, status, QR */
.tag50{width:200px;height:360px;padding:52px 16px 16px}
.tag50 .wm{width:56px}.tag50 .hole{top:14px;width:20px;height:20px;margin-left:-10px}
.tag50 .cat{display:none}.tag50 dl{display:none}
.tag50 h1{font-size:21px;margin-top:26px;line-height:1.02}.tag50 .desc{font-size:10.5px;margin-top:8px}
.tag50 .foot{left:16px;right:16px;bottom:16px;align-items:flex-end}
.tag50 .foot > div:first-child{max-width:118px}.tag50 .status{font-size:9px}.tag50 .status .sq{width:10mm;height:10mm;display:block;margin:0 0 8px}.tag50 .price{font-size:11.5px;margin-top:4px}.tag50 .price.aviso{font-size:7.5px;max-width:100px}
.tag50 .qr{width:40px;height:40px}.tag50 .sub{font-size:7px;margin-top:3px}

/* faca: corte em magenta, sangria 3 mm tracejada, segurança 5 mm pontilhada, furo 5 mm */
.faca{display:none}
body.comfaca .faca{display:block;position:absolute;inset:0;pointer-events:none}
body.comfaca .faca i{position:absolute;display:block}
body.comfaca .faca .corte{inset:0;border:1px solid var(--faca)}
body.comfaca .faca .sang{inset:-12px;border:1px dashed var(--faca);opacity:.7}
body.comfaca .faca .seg{inset:20px;border:1px dotted var(--faca);opacity:.7}
body.comfaca .faca .furo{border:1px solid var(--faca);border-radius:50%}
body.comfaca .tag{overflow:visible;margin-bottom:40px}body.comfaca{gap:70px 60px}
body.comfaca .tag::after{content:attr(data-faca);position:absolute;left:0;top:calc(100% + 18px);width:100%;font-family:var(--mono);font-size:9px;line-height:1.3;color:var(--faca)}

@page{size:105mm 148mm;margin:0}
@media print{html,body{background:none;padding:0;gap:0;display:block}.tag{page-break-after:always;background:none}.a6{width:105mm;height:148mm}.tag50{width:50mm;height:90mm}.tag:last-of-type{page-break-after:auto}}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="wm" viewBox="0 0 272 69"><path d="M176.593 23.0819V1.91833H150.317V66.5948H176.593V44.2791H205.243V1.91833C189.55 1.91833 177.465 13.093 176.593 23.0875V23.0819Z"/><path d="M111.007 0C91.875 0 76.3403 15.3302 76.3403 34.223C76.3403 53.1159 91.8693 68.4461 111.007 68.4461C130.145 68.4461 145.742 53.1159 145.742 34.223C145.742 15.3302 130.213 0 111.007 0ZM111.007 42.4334C106.43 42.4334 102.69 38.8036 102.69 34.2174C102.69 29.6313 106.435 26.0015 111.007 26.0015C115.579 26.0015 119.398 29.6984 119.398 34.2174C119.398 38.7365 115.653 42.4334 111.007 42.4334Z"/><path d="M35.919 19.6423L26.2764 1.91833H0V66.5948H26.2764V44.212H45.4936V66.5948H71.77V1.91833H45.4936L35.919 19.6423Z"/><path d="M272.002 1.87909H211.835V24.7541V34.7487V44.1783V66.5612H272.002V44.7376H238.219L255.669 34.7151L238.236 24.7541H272.002V1.87909Z"/></symbol></svg>
<script>
var q=new URLSearchParams(location.search);var f=q.get('f')||'a6';var only=q.get('p');
if(q.get('faca'))document.body.classList.add('comfaca');
var dims=f==='tag'?'faca 50 × 90 mm · furo ø5 mm a 7 mm do topo · sangria 3 mm · segurança 5 mm · cartão sem revestimento 300 g':'faca 105 × 148 mm · furo ø6 mm a 11 mm do topo · sangria 3 mm · segurança 5 mm · cartão sem revestimento 300 g';
var furo=f==='tag'?'left:calc(50% - 10px);top:18px;width:20px;height:20px':'left:calc(50% - 12px);top:32px;width:24px;height:24px';
fetch('etiquetas.json').then(function(r){return r.json()}).catch(function(e){document.body.innerHTML='<p style="font-family:var(--mono);padding:40px">etiquetas.json com erro de sintaxe: '+e+'</p>';throw e}).then(function(J){
  J.pecas.filter(function(p){return !only||p.handle===only}).forEach(function(p){
    var d=document.createElement('div');d.className='tag '+(f==='tag'?'tag50':'a6');d.id=p.handle;d.setAttribute('data-faca',dims);
    var st=p.status==='pronta'?'<span class="sq"></span>Pronta entrega':'Sob encomenda · ~'+(p.prazo||'120 dias');
    var pr=p.preco==='?'?'<div class="price aviso">Preço: confirmar no Shopify antes de imprimir</div>':(p.preco?'<div class="price">'+p.preco+'</div>':'');
    d.innerHTML='<div class="hole"></div><svg class="wm" viewBox="0 0 272 69" aria-label="MORE"><use href="#wm"/></svg><div class="cat">'+p.cat+'</div><h1>'+p.nome+'</h1><p class="desc">'+p.desc+'</p><dl>'+p.specs.map(function(s){return '<div><dt>'+s[0]+'</dt><dd>'+(s[1]==='?'?'<span class="aviso">confirmar no Shopify antes de imprimir</span>':s[1])+'</dd></div>'}).join('')+'</dl><div class="foot"><div><div class="status">'+st+'</div>'+pr+'</div><div><div class="qr"><img src="img/qr-'+p.handle+'.png" alt=""></div><div class="sub">mymore.design</div></div></div><div class="faca"><i class="sang"></i><i class="corte"></i><i class="seg"></i><i class="furo" style="'+furo+'"></i></div>';
    document.body.appendChild(d);
  });
});
</script>
</body></html>

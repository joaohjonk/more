<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Comunicação 05.11 · More</title>
<style>
@font-face{font-family:Muoto;src:url(../_fonts/205TF-Muoto-Regular.otf) format('opentype')}
@font-face{font-family:MuotoMono;src:url(../_fonts/205TF-MuotoMono-CondensedRegular.woff2) format('woff2')}
:root{--off-white:#E5E1DB;--preto:#2D211E;--cinza-claro:#BDBDBD;--branco:#fff;
--sans:Muoto,"DM Sans",Arial,sans-serif;--mono:MuotoMono,"Martian Mono",ui-monospace,monospace;--out-expo:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--preto);color:var(--off-white);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.sheet{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:var(--preto)}
.art{position:relative;overflow:hidden;background:var(--preto);width:var(--w);height:var(--h)}
.ph{position:absolute;left:0;top:0;width:var(--w);height:var(--ph);overflow:hidden;background:var(--preto)}
.ph img{position:absolute;left:0;top:calc(-1 * var(--crop));width:var(--w);height:auto;display:block}
.band{position:absolute;left:0;right:0;top:var(--ph);bottom:0;padding:var(--pad) var(--m) 0;display:flex;flex-direction:column;align-items:flex-start}
.date{font-size:var(--fd);line-height:.9;letter-spacing:-.02em;font-feature-settings:"lnum" 1,"tnum" 1;white-space:nowrap}
.event{font-size:var(--fe);line-height:.95;margin-top:var(--ge)}
.event i{font-style:normal;color:var(--cinza-claro);display:block}
.foot{margin-top:var(--gf);font-family:var(--mono);font-size:var(--fm);line-height:1.45;color:var(--cinza-claro);display:flex;flex-direction:column}
.foot b{font-weight:400;color:var(--off-white)}
.wm{position:absolute;left:2.5%;width:95%;height:auto;display:block;bottom:var(--bleed);top:var(--wmtop,auto)}
.wm path{fill:var(--off-white)}
.qr{position:absolute;right:var(--m);width:var(--qr);height:var(--qr);display:none;background:var(--off-white);padding:6px}
.qr img{width:100%;height:100%;image-rendering:pixelated;display:block}
.ph .tag{position:absolute;left:var(--m);top:var(--m);font-family:var(--mono);font-size:var(--fm);color:var(--off-white);background:rgba(45,33,30,.55);padding:4px 8px;display:none}
body.placeholder .ph .tag{display:block}

body.story .art{--w:1080px;--h:1920px;--ph:960px;--crop:366px;--m:72px;--pad:56px;--fd:180px;--fe:44px;--ge:14px;--fm:30px;--gf:26px;--bleed:auto;--wmtop:460px}
body.post .art{--w:1080px;--h:1350px;--ph:600px;--crop:726px;--m:60px;--pad:48px;--fd:220px;--fe:44px;--ge:14px;--fm:26px;--gf:22px;--bleed:-90px}
body.wa .art{--w:1200px;--h:1500px;--ph:660px;--crop:813px;--m:72px;--pad:54px;--fd:240px;--fe:46px;--ge:14px;--fm:28px;--gf:24px;--bleed:-96px}
body.a5 .art{--w:592px;--h:840px;--ph:450px;--crop:277px;--m:36px;--pad:32px;--fd:124px;--fe:24px;--ge:12px;--fm:12px;--gf:16px;--bleed:-50px;--qr:84px}
body.a5 .qr{display:block;top:auto;bottom:104px}
body.story .sheet,body.post .sheet,body.wa .sheet{--w:var(--sw);--h:var(--sh)}
body.story{--sw:1080px;--sh:1920px}body.post{--sw:1080px;--sh:1350px}body.wa{--sw:1200px;--sh:1500px}body.a5{--sw:592px;--sh:840px}

/* a5 com sangria 3 mm (12 px): página 154 x 216 mm, sem marcas nem slug (MediaBox = BleedBox, TrimBox = 148 x 210) */
body.a5.bleed{--sw:616px;--sh:864px}
body.a5.bleed .sheet{padding:12px}
body.a5.bleed .art{overflow:visible}
body.a5.bleed .ph{left:-12px;top:-12px;width:calc(var(--w) + 24px);height:calc(var(--ph) + 12px)}
body.a5.bleed .ph img{width:100%}
body.a5.bleed .band{left:-12px;right:-12px;bottom:-12px;padding-left:calc(var(--m) + 12px);padding-right:calc(var(--m) + 12px)}
body.a5.bleed .band .wm{bottom:calc(var(--bleed) - 12px)}
body.a5.bleed .qr{right:calc(var(--m) + 12px);bottom:116px}
.marks,.slug{display:none}
body.a5.bleed .marks{display:block;position:absolute;inset:0;pointer-events:none}
body.a5.bleed .marks i{position:absolute;background:var(--off-white)}
body.a5.bleed .slug{display:flex;position:absolute;left:40px;right:40px;bottom:10px;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--cinza-claro)}
body.a5.bleed .slug span+span{text-align:right}

/* fora das regras: a elipse laranja do convite atual */
.el{display:none}
body.elipse .el{display:flex;position:absolute;align-items:center;justify-content:center;flex-direction:column;border-radius:50%;background:var(--laranja);color:var(--off-white);width:var(--ew);height:var(--eh);left:var(--ex);top:var(--ey);transform:rotate(-8deg)}
body.elipse .el b{font-weight:400;font-size:var(--efd);line-height:.9;letter-spacing:-.02em}
body.elipse .el span{font-family:var(--mono);font-size:var(--efm);margin-top:.4em}
body.elipse .date,body.elipse .event{display:none}
body.elipse .band{justify-content:flex-end;padding-bottom:var(--pad)}
body.elipse .wm{position:static;width:40%;margin-top:var(--gf);bottom:auto;top:auto}
body.elipse.story .art{--ph:1420px;--crop:0px;--ew:560px;--eh:300px;--ex:420px;--ey:980px;--efd:150px;--efm:30px}
body.elipse.post .art{--ph:1000px;--crop:360px;--ew:520px;--eh:280px;--ex:480px;--ey:640px;--efd:140px;--efm:26px}
body.elipse.wa .art{--ph:1120px;--crop:400px;--ew:560px;--eh:300px;--ex:560px;--ey:730px;--efd:150px;--efm:28px}
body.elipse .ph img{top:calc(-1 * var(--crop))}

@page{size:148mm 210mm;margin:0}
body.a5.bleed .marks,body.a5.bleed .slug{display:none}
@media print{html,body{background:none}.sheet{zoom:.9449}}

/* story em vídeo: só cortes secos (R-MOTION-02), durações da escala (R-MOTION-01) */
body.story.motion .veil{display:none}
body.story.motion .date{animation:show 80ms ease 1000ms both}
body.story.motion .event{animation:show 80ms ease 1400ms both}
body.story.motion .foot{animation:show 80ms ease 1800ms both}
body.story.motion .wm{animation:show 80ms ease 1800ms both}
@keyframes show{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none;transition:none}}
</style></head>
<body class="story">
<div class="sheet"><div class="art" id="art">
  <div class="ph"><img id="foto" src="img/cadeira-maria-luz.jpg" alt=""><div class="tag">Trocar pela foto do dia</div></div>
  <div class="veil"></div>
  <div class="el"><b id="eldata"></b><span id="elrot"></span></div>
  <div class="band">
    <div class="date" id="data"></div>
    <div class="event" id="titulo"></div>
    <div class="qr"><img id="qr" src="img/qr-convite-a5.png" alt="QR"></div>
    <div class="foot"><span><b id="end"></b> · <span id="bairro"></span></span><span id="acao"></span></div>
    <svg class="wm" viewBox="0 0 272 69" aria-label="MORE"><path d="M176.593 23.0819V1.91833H150.317V66.5948H176.593V44.2791H205.243V1.91833C189.55 1.91833 177.465 13.093 176.593 23.0875V23.0819Z"/><path d="M111.007 0C91.875 0 76.3403 15.3302 76.3403 34.223C76.3403 53.1159 91.8693 68.4461 111.007 68.4461C130.145 68.4461 145.742 53.1159 145.742 34.223C145.742 15.3302 130.213 0 111.007 0ZM111.007 42.4334C106.43 42.4334 102.69 38.8036 102.69 34.2174C102.69 29.6313 106.435 26.0015 111.007 26.0015C115.579 26.0015 119.398 29.6984 119.398 34.2174C119.398 38.7365 115.653 42.4334 111.007 42.4334Z"/><path d="M35.919 19.6423L26.2764 1.91833H0V66.5948H26.2764V44.212H45.4936V66.5948H71.77V1.91833H45.4936L35.919 19.6423Z"/><path d="M272.002 1.87909H211.835V24.7541V34.7487V44.1783V66.5612H272.002V44.7376H238.219L255.669 34.7151L238.236 24.7541H272.002V1.87909Z"/></svg>
  </div>
</div>
<div class="marks"><i style="left:0;top:40px;width:28px;height:1px"></i><i style="left:40px;top:0;width:1px;height:28px"></i><i style="right:0;top:40px;width:28px;height:1px"></i><i style="right:40px;top:0;width:1px;height:28px"></i><i style="left:0;bottom:40px;width:28px;height:1px"></i><i style="left:40px;bottom:0;width:1px;height:28px"></i><i style="right:0;bottom:40px;width:28px;height:1px"></i><i style="right:40px;bottom:0;width:1px;height:28px"></i></div>
<div class="slug"><span id="slug1">MORE_PRINT_abertura_convite-A5 · trim 148 × 210 mm · sangria 3 mm · segurança 5 mm</span><span>PDF em RGB. PDF/X-4 na gráfica. Preto rico e CMYK a confirmar. Muoto (205TF): licença desktop a confirmar.</span></div>
</div>
<script>
var q=new URLSearchParams(location.search);var piece=q.get('peca')||'convite';var fmt=q.get('f')||'story';
document.body.className=fmt+(q.get('motion')?' motion':'')+(q.get('bleed')?' bleed':'')+(q.get('elipse')?' elipse':'');
fetch('abertura.json').then(function(r){return r.json()}).then(function(J){
  var P=J.pecas[piece];
  document.getElementById('foto').src=P.foto; if(P._foto) document.body.classList.add('placeholder');
  document.getElementById('data').textContent=P.data;
  document.getElementById('titulo').innerHTML=P.titulo+(P.linha?'<i>'+P.linha+'</i>':'');
  document.getElementById('end').textContent=J.endereco; document.getElementById('bairro').textContent=J.bairro;
  document.getElementById('acao').textContent=P.acao;
  document.getElementById('eldata').textContent=J.elipse.data; document.getElementById('elrot').textContent=J.elipse.rotulo;
  document.documentElement.style.setProperty('--laranja',J.elipse.cor);
  document.title=P.titulo+' · '+fmt;
});
</script>
</body></html>

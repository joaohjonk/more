<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Convite 05.11 · More</title>
<style>
@font-face{font-family:Muoto;src:url(../_fonts/205TF-Muoto-Regular.otf) format('opentype')}
@font-face{font-family:MuotoMono;src:url(../_fonts/205TF-MuotoMono-CondensedRegular.woff2) format('woff2')}
:root{--off-white:#E5E1DB;--preto:#2D211E;--cinza-claro:#BDBDBD;--branco:#fff;
--sans:Muoto,"DM Sans",Arial,sans-serif;--mono:MuotoMono,"Martian Mono",ui-monospace,monospace;--out-expo:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--off-white);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.art{position:relative;overflow:hidden;background:#000;width:var(--w);height:var(--h)}
.ph{position:absolute;left:0;top:0;width:var(--w);height:var(--ph);overflow:hidden;background:#000}
.ph img{position:absolute;left:0;top:calc(-1 * var(--crop));width:var(--w);height:auto;display:block}
.band{position:absolute;left:0;right:0;top:var(--ph);bottom:0;padding:var(--pad) var(--m) 0;display:flex;flex-direction:column;align-items:flex-start}
.date{font-size:var(--fd);line-height:.9;letter-spacing:-.02em;font-feature-settings:"lnum" 1,"tnum" 1}
.event{font-size:var(--fe);line-height:.95;margin-top:var(--ge)}
.foot{margin-top:var(--gf);font-family:var(--mono);font-size:var(--fm);line-height:1.45;color:var(--cinza-claro);display:flex;flex-direction:column}
.foot b{font-weight:400;color:var(--off-white)}
/* wordmark XL: 95% of the width, bottom-aligned, bleeds */
.wm{position:absolute;left:2.5%;width:95%;height:auto;display:block;bottom:var(--bleed);top:var(--wmtop,auto)}
.wm path{fill:var(--off-white)}
.qr{position:absolute;right:var(--m);width:var(--qr);height:var(--qr);display:none;background:var(--off-white);padding:6px}
.qr img{width:100%;height:100%;image-rendering:pixelated;display:block}
.qr+.qrl{position:absolute;right:var(--m);font-family:var(--mono);font-size:var(--fm);color:var(--cinza-claro)}

/* story 1080x1920 (Instagram UI: top 250, bottom 250) */
body.story .art{--w:1080px;--h:1920px;--ph:1000px;--crop:326px;--m:72px;--pad:60px;--fd:200px;--fe:44px;--ge:20px;--fm:30px;--gf:30px;--bleed:auto;--wmtop:410px}
/* post 1080x1350 */
body.post .art{--w:1080px;--h:1350px;--ph:640px;--crop:686px;--m:60px;--pad:56px;--fd:240px;--fe:44px;--ge:18px;--fm:26px;--gf:26px;--bleed:-90px}
/* mail / whatsapp 1200x1500 */
body.mail .art{--w:1200px;--h:1500px;--ph:700px;--crop:773px;--m:72px;--pad:62px;--fd:260px;--fe:46px;--ge:20px;--fm:28px;--gf:28px;--bleed:-96px}
/* print A5 148x210 mm @ 4px/mm = 592x840 */
body.print .art{--w:592px;--h:840px;--ph:450px;--crop:277px;--m:36px;--pad:32px;--fd:124px;--fe:24px;--ge:12px;--fm:12px;--gf:16px;--bleed:-50px;--qr:84px}
body.print .qr{display:block;top:auto;bottom:104px}
body.print .qr+.qrl{display:block;top:auto;bottom:192px;width:var(--qr);text-align:center}
@page{size:148mm 210mm;margin:0}
@media print{html,body{background:#000}}

/* motion (story): lights come up on the piece, then the words. 7 s loop */
body.story.motion .veil{position:absolute;inset:0;background:#000;animation:veil 7s linear both}
body.story.motion .ph img{animation:settle 7s var(--out-expo) both}
body.story.motion .date{animation:rise 7s both}
body.story.motion .event{animation:rise2 7s both}
body.story.motion .foot{animation:rise3 7s both}
body.story.motion .wm{animation:rise3 7s both}
@keyframes veil{0%{opacity:1}5%{opacity:1}17%{opacity:0}91%{opacity:0}100%{opacity:1}}6%{opacity:1}40%{opacity:0}90%{opacity:0}100%{opacity:1}}
@keyframes settle{0%{transform:scale(1.03)}5%{transform:scale(1.03)}22%{transform:scale(1)}100%{transform:scale(1)}}6%{transform:scale(1.04)}48%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes rise{0%,16%{opacity:0;transform:translateY(16px)}24%{opacity:1;transform:none}91%{opacity:1}100%{opacity:0;transform:none}}42%{opacity:1;transform:none}90%{opacity:1}100%{opacity:0;transform:none}}
@keyframes rise2{0%,20%{opacity:0;transform:translateY(14px)}28%{opacity:1;transform:none}91%{opacity:1}100%{opacity:0;transform:none}}48%{opacity:1;transform:none}90%{opacity:1}100%{opacity:0;transform:none}}
@keyframes rise3{0%,24%{opacity:0;transform:translateY(12px)}32%{opacity:1;transform:none}91%{opacity:1}100%{opacity:0;transform:none}}56%{opacity:1;transform:none}90%{opacity:1}100%{opacity:0;transform:none}}
</style></head>
<body class="story">
<div class="art" id="art">
  <div class="ph"><img src="img/cadeira-maria-luz.jpg" alt="Cadeira Maria deitada sob uma luz de janela"></div>
  <div class="veil"></div>
  <div class="band">
    <div class="date">05.11</div>
    <div class="event">Abertura da loja</div>

    <div class="foot"><span><b>Al. Franca 1332, Casa 04</b> · Jardins, São Paulo</span><span>[Confirmar presença] WhatsApp (11) 91209-2600</span></div>
    <svg class="wm" viewBox="0 0 272 69" aria-label="MORE"><path d="M176.593 23.0819V1.91833H150.317V66.5948H176.593V44.2791H205.243V1.91833C189.55 1.91833 177.465 13.093 176.593 23.0875V23.0819Z"/><path d="M111.007 0C91.875 0 76.3403 15.3302 76.3403 34.223C76.3403 53.1159 91.8693 68.4461 111.007 68.4461C130.145 68.4461 145.742 53.1159 145.742 34.223C145.742 15.3302 130.213 0 111.007 0ZM111.007 42.4334C106.43 42.4334 102.69 38.8036 102.69 34.2174C102.69 29.6313 106.435 26.0015 111.007 26.0015C115.579 26.0015 119.398 29.6984 119.398 34.2174C119.398 38.7365 115.653 42.4334 111.007 42.4334Z"/><path d="M35.919 19.6423L26.2764 1.91833H0V66.5948H26.2764V44.212H45.4936V66.5948H71.77V1.91833H45.4936L35.919 19.6423Z"/><path d="M272.002 1.87909H211.835V24.7541V34.7487V44.1783V66.5612H272.002V44.7376H238.219L255.669 34.7151L238.236 24.7541H272.002V1.87909Z"/></svg>
  </div>
</div>
<script>
var q=new URLSearchParams(location.search);document.body.className=(q.get('piece')||'story')+(q.get('motion')?' motion':'');
</script>
</body></html>
